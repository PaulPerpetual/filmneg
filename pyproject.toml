[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmneg"
version = "0.1.0"
description = "Human-in-the-loop colour correction for film scans"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tifffile>=2023.1",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
filmneg = "filmneg.server:main"

[tool.setuptools]
packages = ["filmneg"]

[tool.setuptools.package-data]
filmneg = ["web/*"]
